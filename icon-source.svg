<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#17151d"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3c98f"/>
      <stop offset="50%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#ab8a52"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Moldura circular dourada, ecoando o .auth-mark -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#goldSoft)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.85"/>

  <!-- Monograma -->
  <text x="256" y="300"
        font-family="Georgia, 'Liberation Serif', 'Times New Roman', serif"
        font-size="185"
        font-weight="500"
        text-anchor="middle"
        letter-spacing="-6"
        fill="url(#gold)">LR</text>

  <!-- Linha fina decorativa abaixo do monograma -->
  <line x1="196" y1="336" x2="316" y2="336" stroke="url(#gold)" stroke-width="2" opacity="0.75"/>

  <!-- Eyebrow -->
  <text x="256" y="368"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="5"
        text-anchor="middle"
        fill="#c9a96e" opacity="0.85">LUXURY RESIDENCES</text>
</svg>
